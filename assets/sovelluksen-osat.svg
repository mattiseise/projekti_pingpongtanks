<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
<title id="title">How the parts of Ping Pong Tanks fit together</title>
<desc id="desc">Illustration, not a screenshot. The scene holds what the players see: the menus, two tank prefabs, the shells, the maze walls and floor, the power-up pickups and the HUD with the score and the active powers. The C# scripts control those objects: movement and shooting, the shell's ricochet, lifetime and hits, the round manager with the score, the five-second rule and the restart, the maze generator that uses depth-first search as a plain C# class with a builder, the power-up system with spawning, one power at a time and timers, and the menus and settings. The data kept outside the code is read by the scripts: the arena configuration with the size and tile types, three power-up data assets with duration and effect, and the saved settings in PlayerPrefs. You choose the store for arena and power-up data in week 40, ScriptableObject or JSON, and the settings go to PlayerPrefs in week 46, as agreed. The release path runs from the Git repository with the project and project-docs, to a build for the agreed target, to release candidate v1.0-rc1 that an outsider tests, and to release v1.0 with the written guide.</desc>
