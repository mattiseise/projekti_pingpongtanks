<svg xmlns="http://www.w3.org/2000/svg" width="880" height="722" viewBox="0 0 880 722" role="img" aria-labelledby="title desc">
<title id="title">Ping Pong Tanks: project phases</title>
<desc id="desc">1. Core game: a playable round (weeks 36–39): You break the GDD into a prioritised backlog and set up the Unity project, then build movement, the bouncing shell and a whole round with scoring. They come first because every later feature drives, shoots or scores on top of them. 2. Arena, powers and the review (weeks 40–43): You replace the test arena with a generated maze and add three data-driven power-ups. In week 43 the client plays this version, and together you decide what fits into the remaining weeks. Autumn break · week 42. 3. Complete and tested game (weeks 44–46): You answer the client's feedback through a pull request, run the whole test matrix and build the menu path. The game becomes reliable and complete before anyone outside the project tries it. 4. Release and handover (weeks 47–49): An outside tester starts the release candidate from your written guide alone. You fix only blocking bugs, release v1.0 and hand the MVP and the documentation over on 4 December.</desc>
<rect width="880" height="722" fill="#ffffff"/>
<defs><marker id="nuoli" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="#5c5347" stroke-width="1.4"/></marker></defs>
